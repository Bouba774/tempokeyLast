name: Build TempoKey Android (APK + AAB, signed)
run-name: Android build ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Semantic version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      versionCode:
        description: "Integer version code"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: TempoKey signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tempokey-android-${{ github.ref }}
      cancel-in-progress: true
    env:
      VERSION_NAME: ${{ github.event.inputs.versionName || '1.0.0' }}
      VERSION_CODE: ${{ github.event.inputs.versionCode || github.run_number }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Signing — exported so Gradle's System.getenv() picks them up.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (incl. build-tools for apksigner)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile || bun install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Android project (SPA build + Capacitor sync)
        run: bash scripts/prepare-android.sh

      - name: Guard APK fixes are included
        run: |
          set -euo pipefail

          echo "▶ Checking Android back/crash fixes in source…"
          grep -q "App.minimizeApp" src/lib/android-back.ts
          grep -q "blurEditableAndHideKeyboard" src/lib/android-back.ts
          grep -q "handlingBack" src/lib/android-back.ts
          grep -q "hash.startsWith(\"#/\")" src/lib/android-back.ts
          grep -q 'path === "/index"' src/lib/android-back.ts
          grep -q "closeTopTempoKeyOverlay" src/lib/android-back.ts
          grep -q "stabilizeAndroidFocus" src/lib/android-ui.ts
          grep -q "closeAndroidSafe" src/lib/android-ui.ts
          grep -q "android-bottom-sheet" src/components/TrackDetailSheet.tsx
          grep -q "requestIdleCallback" src/hooks/useChunkedTrackFilter.ts
          grep -q "handlerRef.current" src/hooks/useBackHandler.ts
          grep -q "native-android" capacitor/main.tsx
          grep -q "visualViewport" capacitor/main.tsx

          echo "▶ Checking generated Android project contains native fixes…"
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/app/lovable/tempokey/folderpicker/FolderPickerPlugin.java
          test -f android/app/src/main/java/app/lovable/tempokey/analysis/AnalysisForegroundService.java
          test -f android/app/src/main/java/app/lovable/tempokey/analysis/AnalysisNotificationPlugin.java

          grep -q 'android.permission.READ_MEDIA_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WAKE_LOCK' android/app/src/main/AndroidManifest.xml
          grep -q 'android:windowSoftInputMode="adjustResize"' android/app/src/main/AndroidManifest.xml
          grep -q 'AnalysisForegroundService' android/app/src/main/AndroidManifest.xml

          MAIN_ACTIVITY=$(find android/app/src/main/java -name MainActivity.java | head -n1)
          test -n "$MAIN_ACTIVITY"
          grep -q 'registerPlugin(FolderPickerPlugin.class)' "$MAIN_ACTIVITY"
          grep -q 'registerPlugin(AnalysisNotificationPlugin.class)' "$MAIN_ACTIVITY"

          grep -q 'requestPermissionForAlias(alias, call, "pickFolderPermissionCallback")' android/app/src/main/java/app/lovable/tempokey/folderpicker/FolderPickerPlugin.java
          grep -q 'takePersistableUriPermission' android/app/src/main/java/app/lovable/tempokey/folderpicker/FolderPickerPlugin.java
          grep -q 'getPlayableUri' android/app/src/main/java/app/lovable/tempokey/folderpicker/FolderPickerPlugin.java
          grep -q 'PARTIAL_WAKE_LOCK' android/app/src/main/java/app/lovable/tempokey/analysis/AnalysisForegroundService.java
          grep -q 'setTextZoom(100)' "$MAIN_ACTIVITY"
          grep -q 'setOverScrollMode(android.view.View.OVER_SCROLL_NEVER)' "$MAIN_ACTIVITY"

          echo "✓ APK fixes verified before Gradle build"

      - name: Stamp version
        run: bash scripts/android-version.sh "${VERSION_CODE}" "${VERSION_NAME}"

      - name: Decode release keystore
        run: |
          set -e
          mkdir -p android/app
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "❌ Secret ANDROID_KEYSTORE_BASE64 is empty." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/tempokey-release.keystore
          ls -l android/app/tempokey-release.keystore
          file android/app/tempokey-release.keystore || true
          echo "▶ Signing inputs (values hidden):"
          echo "  keystore file : $( [ -s android/app/tempokey-release.keystore ] && echo present || echo MISSING )"
          echo "  store password: $( [ -n "${ANDROID_STORE_PASSWORD:-}" ] && echo set || echo MISSING )"
          echo "  key alias     : $( [ -n "${ANDROID_KEY_ALIAS:-}" ] && echo set || echo MISSING )"
          echo "  key password  : $( [ -n "${ANDROID_KEY_PASSWORD:-}" ] && echo set || echo MISSING )"

      - name: Inject release signing into build.gradle
        run: |
          set -e
          GRADLE=android/app/build.gradle
          if grep -q "signingConfigs.release" "$GRADLE"; then
            echo "signingConfigs.release already present — skipping append"
          else
            cat >> "$GRADLE" <<'GRADLE'

          // ───── TempoKey release signing (injected by CI) ─────
          android {
              signingConfigs {
                  release {
                      storeFile file("tempokey-release.keystore")
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          GRADLE
            echo "✓ release signing block appended to $GRADLE"
          fi
          tail -n 30 "$GRADLE"

      - name: Build signed Release APK + AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Collect, rename & verify artifacts
        id: artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts

          APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | sort | head -n1)
          if [ -z "$APK_SRC" ]; then
            echo "❌ No signed release APK found." >&2
            find android/app/build/outputs/apk -type f >&2 || true
            exit 1
          fi
          cp "$APK_SRC" artifacts/TempoKey.apk
          echo "APK : $APK_SRC → artifacts/TempoKey.apk ($(stat -c%s artifacts/TempoKey.apk) bytes)"

          AAB_SRC=$(find android/app/build/outputs/bundle/release -name "*.aab" | sort | head -n1 || true)
          if [ -n "$AAB_SRC" ]; then
            cp "$AAB_SRC" artifacts/TempoKey.aab
            echo "AAB : $AAB_SRC → artifacts/TempoKey.aab ($(stat -c%s artifacts/TempoKey.aab) bytes)"
          else
            echo "⚠ No AAB produced"
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          APKSIGNER="${BUILD_TOOLS}apksigner"
          echo "▶ apksigner verify"
          "$APKSIGNER" verify --verbose --print-certs artifacts/TempoKey.apk

          test -s artifacts/TempoKey.apk
          if [ -f artifacts/TempoKey.aab ]; then test -s artifacts/TempoKey.aab; fi
          echo "✓ Release artifacts ready for download"

      - name: Upload TempoKey.apk
        uses: actions/upload-artifact@v4
        with:
          name: TempoKey-APK-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          path: artifacts/TempoKey.apk
          if-no-files-found: error

      - name: Upload TempoKey.aab
        uses: actions/upload-artifact@v4
        with:
          name: TempoKey-AAB-v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          path: artifacts/TempoKey.aab
          if-no-files-found: warn
